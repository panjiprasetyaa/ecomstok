[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://unpkg.com; img-src 'self' data: https:; font-src 'self' https: data:;"

[[redirects]]
  from = "/dapur"
  to = "/dapur-gizi.html"
  status = 200

[[redirects]]
  from = "/klinis"
  to = "/index.html"
  status = 200
